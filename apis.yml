    this deployment — discovery works at the namespace index instead. DalCor publishes no developer
    documentation, no API reference and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that describes the wp/v2 contract.
