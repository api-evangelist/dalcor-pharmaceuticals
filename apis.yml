apis:
- aid: dalcor-pharmaceuticals:dalcor-pharmaceuticals-content-api
  name: DalCor Pharmaceuticals Content API
  description: >-
    The anonymously readable WordPress REST API behind dalcorpharma.com. It exposes DalCor's press
    releases (posts, all in the press-releases category), the corporate and clinical-programme pages
    (About DalCor, Management, Board of Directors, Partners, Science, Dalcetrapib History, Precision
    Medicine for Cardiovascular Diseases, Cardiovascular Diseases, Publications, dal-GenE trial,
    Dal-GenE-2 trial, DAL-302 study information for clinical trial sites, Contact Us, Privacy
    Policy), the media library, the post categories, and cross-content search — in both the English
    and French editions via the WPML wpml_language parameter. This is not a developer product DalCor
    markets; it is the site's own content surface, registered at /wp-json/ and verified to return
    data without credentials. The OpenAPI in this repo is derived from the published wp/v2 route
    index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://dalcorpharma.com/wp-json
