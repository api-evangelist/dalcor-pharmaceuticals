aid: dalcor-pharmaceuticals
name: DalCor Pharmaceuticals
description: >-
  DalCor Pharmaceuticals is a clinical-stage biopharmaceutical company founded in 2015 and
  headquartered in Montreal, Quebec, with offices in Zug, Switzerland, Leatherhead in the United
  Kingdom, and Sarasota, Florida. It is developing dalcetrapib, positioned as the first
  pharmacogenetic precision medicine in cardiovascular disease, targeted specifically at patients
  carrying the AA genotype at the rs1967309 variant of the ADCY9 gene — a genotype present in up to
  20% of the general population and in more than 40% of populations of African ancestry. DalCor holds
  the worldwide exclusive license to develop, manufacture and commercialise dalcetrapib together with
  rights to the companion genetic marker. The compound is being evaluated in Dal-GenE-2 (DAL-302), a
  Phase 3 double-blind randomized placebo-controlled cardiovascular outcomes confirmatory trial in
  2,000 post-acute-coronary-syndrome patients with the ADCY9 AA genotype, coordinated by the Montreal
  Health Innovations Coordinating Centre and following the dal-GenE (DAL-301) trial, which showed a
  21% relative risk reduction in fatal and non-fatal myocardial infarction across 6,149 patients in
  34 countries. DalCor runs no developer program and publishes no product API; the only
  machine-readable surface it exposes is the anonymously readable WordPress REST content API behind
  dalcorpharma.com, which serves the bilingual English/French corporate site.
