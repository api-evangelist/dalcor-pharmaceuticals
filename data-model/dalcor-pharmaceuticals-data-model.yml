  kind: has_one
  via: featured_media
- from: MediaItem
  to: Post
  kind: belongs_to
  via: post
  detail: The post or page the attachment was uploaded to; 0 when unattached.
- from: Comment
  to: Post
  kind: belongs_to
  via: post
absent_entities:
  note: >-
    Recorded because their absence is the finding. No custom content type exists for team members,
    board members, partners, pipeline programmes, clinical trials, publications or events — all of
    that content is unstructured HTML inside Page.content.rendered. An agent wanting the management
    roster or the publication list must parse the rendered HTML of pages 75, 110, 135 and 159; there
    is no typed record to query.
  candidates_not_registered: [team, publication, event, trial, pipeline, partner]
