      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTaxonomy:
      description: Invalid taxonomy (`rest_taxonomy_invalid`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenContext:
      description: '`context=edit` requested anonymously (`rest_forbidden_context`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_forbidden_context
            message: Sorry, you are not allowed to edit posts in this post type.
            data:
              status: 401
